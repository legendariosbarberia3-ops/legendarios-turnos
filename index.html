<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101010">
  <title>Turnos | Legendarios Barbería</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      background: #101010;
      color: white;
      font-family: Arial, sans-serif;
    }
    main {
      max-width: 520px;
      margin: 25px auto;
      padding: 28px 22px;
      background: #1b1b1b;
      border: 1px solid #333;
      border-radius: 16px;
    }
    h1 {
      text-align: center;
      color: #e8c84a;
      letter-spacing: 3px;
      margin-bottom: 6px;
    }
    .sub {
      text-align: center;
      color: #aaa;
      margin-bottom: 28px;
    }
    label {
      display: block;
      margin: 17px 0 8px;
      color: #e8c84a;
      font-size: 14px;
    }
    input, select, button {
      width: 100%;
      padding: 14px;
      border-radius: 9px;
      font-size: 16px;
    }
    input, select {
      background: #101010;
      color: white;
      border: 1px solid #444;
    }
    button {
      margin-top: 22px;
      border: 0;
      background: #e8c84a;
      color: #111;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .5; }
    #mensaje {
      margin-top: 18px;
      text-align: center;
      line-height: 1.5;
    }
    .nota {
      text-align: center;
      color: #999;
      font-size: 12px;
      margin-top: 25px;
    }
  </style>
</head>
<body>
  <main>
    <h1>LEGENDARIOS</h1>
    <p class="sub">BARBERÍA · RESERVÁ TU TURNO</p>

    <form id="reserva">
      <label for="servicio">Servicio</label>
      <select id="servicio" required>
        <option value="">Elegí un servicio</option>
        <option value="Corte">Corte — $14.000</option>
        <option value="Barba">Barba — $10.000</option>
        <option value="Corte + barba">Corte + barba — $18.000</option>
      </select>

      <label for="barbero">Barbero</label>
      <select id="barbero" required>
        <option value="">Elegí tu barbero</option>
        <option>Luciano</option>
        <option>Esteban</option>
        <option>Ramiro</option>
        <option>Alejo</option>
      </select>

      <label for="fecha">Fecha</label>
      <input id="fecha" type="date" required>

      <label for="hora">Horario disponible</label>
      <select id="hora" required>
        <option value="">Primero elegí servicio, barbero y fecha</option>
      </select>

      <label for="cliente">Nombre y apellido</label>
      <input id="cliente" type="text" placeholder="Tu nombre" required>

      <label for="telefono">WhatsApp</label>
      <input id="telefono" type="tel" placeholder="Tu número de teléfono" required>

      <button id="confirmar" type="submit">CONFIRMAR TURNO</button>
    </form>

    <div id="mensaje"></div>
    <p class="nota">Legendarios Barbería · Santa Lucía, San Juan</p>
    <hr style="border-color:#444;margin:25px 0">

<button type="button" onclick="mostrarAdmin()">
  ACCESO ADMINISTRATIVO
</button>

<section id="admin" style="display:none;margin-top:25px">
  <h2 style="color:#e8c84a;text-align:center">ADMINISTRACIÓN</h2>

  <label for="adminPin">PIN de administrador</label>
  <input id="adminPin" type="password" placeholder="Ingresá tu PIN">

  <button type="button" onclick="ingresarAdmin()">INGRESAR</button>

  <div id="panelAdmin" style="display:none">
    <label for="fechaAdmin">Fecha de reservas</label>
    <input type="date" id="fechaAdmin">

    <button type="button" onclick="cargarReservas()">VER RESERVAS</button>

    <div id="listaReservas"></div>
  </div>

  <div id="mensajeAdmin"></div>
</section>
  </main>

  <script>
    const fecha = document.getElementById('fecha');
    const hora = document.getElementById('hora');
    const mensaje = document.getElementById('mensaje');
    const boton = document.getElementById('confirmar');

    fecha.min = new Date(Date.now() - new Date().getTimezoneOffset() * 60000)
      .toISOString().slice(0, 10);

    async function consultarHorarios() {
      const servicio = document.getElementById('servicio').value;
      const barbero = document.getElementById('barbero').value;
      const dia = fecha.value;

      if (!servicio || !barbero || !dia) return;

      hora.innerHTML = '<option value="">Consultando horarios...</option>';

      try {
        const resultado = await api('slots', {
          servicio, barbero, fecha: dia
        });

        hora.innerHTML = '<option value="">Elegí un horario</option>';
        resultado.forEach(item => {
          if (item.available) {
            const opcion = document.createElement('option');
            opcion.value = item.time;
            opcion.textContent = item.time;
            hora.appendChild(opcion);
          }
        });

        if (hora.options.length === 1) {
          hora.innerHTML = '<option value="">No hay horarios disponibles</option>';
        }
      } catch (error) {
        hora.innerHTML = '<option value="">No se pudieron consultar los horarios</option>';
      }
    }

    ['servicio', 'barbero', 'fecha'].forEach(id => {
      document.getElementById(id).addEventListener('change', consultarHorarios);
    });

    async function api(accion, datos) {
      const respuesta = await fetch('/.netlify/functions/api', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ accion, datos })
      });

      if (!respuesta.ok) throw new Error('Error de conexión');
      const resultado = await respuesta.json();
      if (resultado.error) throw new Error(resultado.error);
      return resultado;
    }

    document.getElementById('reserva').addEventListener('submit', async e => {
      e.preventDefault();
      boton.disabled = true;
      boton.textContent = 'PROCESANDO...';
      mensaje.textContent = '';

      try {
        const resultado = await api('reservar', {
          servicio: document.getElementById('servicio').value,
          barbero: document.getElementById('barbero').value,
          fecha: fecha.value,
          hora: hora.value,
          cliente: document.getElementById('cliente').value,
          telefono: document.getElementById('telefono').value
        });

       mensaje.textContent = resultado.mensaje || '¡Tu turno está reservado correctamente! 💈';
        if (resultado.ok) e.target.reset();
      } catch (error) {
        mensaje.textContent = 'No se pudo completar la reserva. Intentá nuevamente.';
      }

      boton.disabled = false;
      boton.textContent = 'CONFIRMAR TURNO';
    });
    let pinAdministrador = '';

function mostrarAdmin() {
  document.getElementById('admin').style.display = 'block';
}

async function ingresarAdmin() {
  const pin = document.getElementById('adminPin').value;
  const mensajeAdmin = document.getElementById('mensajeAdmin');

  mensajeAdmin.textContent = 'Verificando PIN...';

  try {
    const resultado = await api('adminLogin', { pin });

    if (!resultado.ok) {
      throw new Error('PIN incorrecto.');
    }

    pinAdministrador = pin;
    document.getElementById('panelAdmin').style.display = 'block';

    const hoy = new Date();
    const fechaLocal = new Date(
      hoy.getTime() - hoy.getTimezoneOffset() * 60000
    ).toISOString().slice(0, 10);

    document.getElementById('fechaAdmin').value = fechaLocal;
    mensajeAdmin.textContent = '¡Acceso autorizado!';
    await cargarReservas();

  } catch (error) {
    pinAdministrador = '';
    mensajeAdmin.textContent = error.message || 'No se pudo ingresar.';
  }
}


async function cargarReservas() {
  const lista = document.getElementById('listaReservas');
  const fecha = document.getElementById('fechaAdmin').value;

  lista.textContent = 'Cargando reservas...';

  try {
    const reservas = await api('adminBookings', {
      pin: pinAdministrador,
      fecha: fecha
    });

    lista.replaceChildren();

    if (!reservas.length) {
      lista.textContent = 'No hay reservas para esta fecha.';
      return;
    }

    reservas.forEach(reserva => {
      const tarjeta = document.createElement('div');
      tarjeta.style.cssText =
        'background:#101010;border:1px solid #444;border-radius:10px;padding:14px;margin-top:12px';

      const titulo = document.createElement('h3');
      titulo.style.color = '#e8c84a';
      titulo.textContent = reserva.time + ' · ' + reserva.barber;

      const detalle = document.createElement('p');
      detalle.style.lineHeight = '1.7';
      detalle.textContent =
        reserva.name + ' | ' + reserva.phone +
        ' | ' + reserva.service +
        ' | $' + reserva.price;

      const ubicacion = document.createElement('p');
      ubicacion.textContent = 'Pestaña: ' + (reserva.sheet || 'Turnos');
      ubicacion.style.color = '#aaa';

      const estado = document.createElement('select');
      estado.style.cssText =
        'padding:10px;width:100%;margin-top:10px;border-radius:8px;font-weight:bold';

      ['Pendiente', 'Confirmado', 'Atendido', 'Cancelado'].forEach(opcion => {
        const elemento = document.createElement('option');
        elemento.value = opcion;
        elemento.textContent = opcion;
        estado.appendChild(elemento);
      });

      estado.value = reserva.status;

      function pintarEstado() {
        const colores = {
          Pendiente: '#e8c84a',
          Confirmado: '#4da3ff',
          Atendido: '#35b86b',
          Cancelado: '#e04b4b'
        };
        estado.style.background = colores[estado.value] || '#fff';
        estado.style.color = '#111';
      }

      pintarEstado();

      estado.onchange = async () => {
        const nuevoEstado = estado.value;
        pintarEstado();
        estado.disabled = true;

        try {
          await cambiarEstado(reserva.id, nuevoEstado);
        } catch (error) {
          alert(error.message || 'No se pudo cambiar el estado.');
          estado.disabled = false;
        }
      };

      tarjeta.append(titulo, detalle, ubicacion, estado);
      lista.appendChild(tarjeta);
    });

  } catch (error) {
    lista.textContent = error.message || 'Error al cargar las reservas.';
  }
}


async function cambiarEstado(id, estado) {
  if (!confirm('¿Querés cambiar el estado de este turno a ' + estado + '?')) {
    return;
  }

  try {
    await api('adminStatus', {
      pin: pinAdministrador,
      id: id,
      estado: estado
    });

    await cargarReservas();
  } catch (error) {
    alert(error.message || 'No se pudo actualizar el turno.');
  }
}
  </script>
</body>
</html>
